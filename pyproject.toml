[project]
name = "guarita"
version = "0.1.0"
description = "Firewall para agentes de IA que usam o Model Context Protocol (MCP)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
guarita = "guarita.cli:main"
guarita-lab-server = "guarita.lab.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
